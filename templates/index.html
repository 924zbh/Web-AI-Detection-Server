<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drone-CV | AI 视觉实验室</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #0f172a;
            --card-bg: rgba(255, 255, 255, 0.95);
        }

        body { 
            font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif; 
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at top left, #1e293b, #0f172a);
            color: #1e293b; 
        }

        /* 动态背景修饰 */
        body::before {
            content: "";
            position: absolute;
            width: 300px;
            height: 300px;
            background: var(--primary);
            filter: blur(120px);
            opacity: 0.15;
            top: 10%;
            left: 10%;
            z-index: -1;
        }

        .card { 
            background: var(--card-bg); 
            padding: 40px; 
            border-radius: 32px; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); 
            width: 90%; 
            max-width: 440px; 
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.3);
            transition: transform 0.3s ease;
        }

        h2 { 
            margin: 0 0 10px 0; 
            font-size: 28px;
            background: linear-gradient(135deg, #1e293b 0%, #2563eb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 30px;
        }

        /* 自定义上传区域 */
        .upload-area {
            border: 2px dashed #e2e8f0;
            border-radius: 20px;
            padding: 30px 20px;
            margin-bottom: 25px;
            cursor: pointer;
            transition: all 0.2s;
            background: #f8fafc;
        }

        .upload-area:hover {
            border-color: var(--primary);
            background: #eff6ff;
        }

        .upload-icon {
            font-size: 40px;
            margin-bottom: 10px;
            display: block;
        }

        #img-input { display: none; }

        .btn { 
            background: var(--primary); 
            color: white; 
            border: none; 
            padding: 16px 24px; 
            border-radius: 16px; 
            cursor: pointer; 
            width: 100%; 
            font-size: 16px; 
            font-weight: 600; 
            box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.3);
            transition: all 0.2s; 
        }

        .btn:hover { 
            background: var(--primary-hover);
            box-shadow: 0 15px 20px -5px rgba(37, 99, 235, 0.4);
            transform: translateY(-1px);
        }

        .btn:active { transform: translateY(1px); }

        #res-box { display: none; margin-top: 20px; animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1); }

        .img-container {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
            background: #000;
        }

        img { display: block; width: 100%; height: auto; transition: 0.3s; }

        .stat-badge {
            display: inline-block;
            margin-top: 15px;
            padding: 6px 14px;
            background: #f1f5f9;
            border-radius: 100px;
            font-size: 12px;
            color: #475569;
            font-weight: 500;
        }

        @keyframes slideUp { 
            from { opacity: 0; transform: translateY(30px); } 
            to { opacity: 1; transform: translateY(0); } 
        }

        /* 隐藏滚动条但保留功能 */
        ::-webkit-scrollbar { width: 0; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Drone-CV</h2>
        <p class="subtitle">基于 YOLO 的轻量化边缘计算推理终端</p>
        
        <div id="upload-ui">
            <div class="upload-area" onclick="document.getElementById('img-input').click()">
                <span class="upload-icon">📸</span>
                <p id="file-name" style="margin: 5px 0; font-size: 14px; color: #475569;">点击或拖拽上传图片</p>
                <p style="font-size: 12px; color: #94a3b8;">支持 JPG, PNG, WEBP</p>
            </div>
            
            <input type="file" id="img-input" accept="image/*" onchange="updateFileName(this)">
            <button class="btn" onclick="speedyUpload()">分析</button>
            <p style="font-size: 11px; color: #94a3b8; margin-top: 15px;">智能压缩技术已启用，提升约 80% 传输速度</p>
        </div>

        <div id="res-box">
            <div class="img-container">
                <img id="res-img" src="">
            </div>
            <div id="time-stat" class="stat-badge"></div>
            <button class="btn" style="background: #1e293b; margin-top: 20px; box-shadow: none;" onclick="location.reload()">继续检测</button>
        </div>
    </div>

    <script>
        function updateFileName(input) {
            const name = input.files[0]?.name || "点击或拖拽上传图片";
            document.getElementById('file-name').innerText = name;
            document.getElementById('file-name').style.color = "#2563eb";
        }

        async function speedyUpload() {
            const file = document.getElementById('img-input').files[0];
            if (!file) return Swal.fire({ icon: 'warning', title: '未选择图片', text: '请先选取需要分析的照片', confirmButtonColor: '#2563eb' });

            const startTime = Date.now();

            Swal.fire({
                title: 'AI 引擎启动中',
                html: '执行本地预处理与数据压缩...',
                allowOutsideClick: false,
                showConfirmButton: false,
                didOpen: () => { Swal.showLoading(); }
            });

            // 1. 本地压缩：限制宽度 1080px
            const blob = await compressImage(file, 1080, 0.7);
            
            const formData = new FormData();
            formData.append('image', blob, 'upload.jpg');

            try {
                // 如果本地调试，请确保请求地址正确
                const response = await fetch('/detect', { method: 'POST', body: formData });
                const data = await response.json();
                
                if(data.status === 'success') {
                    const totalTime = ((Date.now() - startTime) / 1000).toFixed(2);
                    Swal.close();
                    
                    document.getElementById('upload-ui').style.display = 'none';
                    document.getElementById('res-box').style.display = 'block';
                    document.getElementById('res-img').src = '/' + data.res_url + '?t=' + Date.now();
                    document.getElementById('time-stat').innerHTML = `<b>处理成功</b> | 耗时 ${totalTime}s`;
                } else {
                    throw new Error(data.error);
                }
            } catch (err) {
                Swal.fire({ icon: 'error', title: '分析失败', text: '后端服务连接超时，请检查网络。', confirmButtonColor: '#1e293b' });
            }
        }

        function compressImage(file, maxWidth, quality) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        canvas.toBlob((b) => resolve(b), 'image/jpeg', quality);
                    };
                };
            });
        }
    </script>
</body>
</html>
